[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faderly"
version = "0.9.0"
description = "One mixer for the sound on all my machines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14,<4",
    "psutil>=7.2,<8",
    "pycaw>=20260927",
    "pystray>=0.19.5,<1",
    "pywebview>=6.2,<7",
    "winrt-Windows.Foundation>=4!10.0.28000.2957",
    "winrt-Windows.Foundation.Collections>=4!10.0.28000.2957",
    "winrt-Windows.Media.Control>=4!10.0.28000.2957",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.2"]

[project.scripts]
faderly = "audiohub.__main__:main"

[tool.setuptools]
packages = ["audiohub"]

[tool.setuptools.package-data]
audiohub = ["web/*.html"]
