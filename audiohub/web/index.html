<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faderly</title>
<style>
:root{
  --bg:#f4f4f6; --card:#fff; --fg:#1c1c1f; --muted:#6c6c74; --line:#e2e2e8;
  --accent:#2f6fed; --meter:#2fb862; --chip:#ececf1; --danger:#d93a3a;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#161618; --card:#222226; --fg:#ececf0; --muted:#9a9aa4; --line:#323238;
         --accent:#6a95ff; --meter:#37d06f; --chip:#2e2e34; --danger:#ff6b6b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 "Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.offline{display:none;margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--danger);color:#fff;font-size:13px}
body.down .offline{display:block}
/* Tray flyout: the card is the whole window. */
body.flyout{background:var(--card);overflow-y:auto}
body.flyout main{max-width:none;padding:0}
body.flyout .machine{border:0;border-radius:0;margin:0;padding:12px 14px}
body.flyout .offline{margin:8px 14px 0}
.openfull{display:none}
body.flyout .openfull{display:block}
.machine{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.mhead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-bottom:6px}
.mhead .dev{flex:0 1 auto;min-width:0}
/* The device name opens the output picker. */
.machine{position:relative}
button.dev{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;min-width:0;
           font-size:12px;color:var(--muted)}
button.dev .devname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.dev .chev{font-size:10px}
button.dev:disabled{cursor:default;background:transparent}
button.dev:disabled .chev{display:none}
.devmenu{position:absolute;left:10px;right:10px;top:44px;z-index:10;padding:4px;
         background:var(--card);border:1px solid var(--line);border-radius:10px;
         box-shadow:0 8px 24px rgba(0,0,0,.25)}
.devmenu[hidden]{display:none}
.devmenu h4{margin:4px 8px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--muted);font-weight:600}
.devmenu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;text-align:left}
.devmenu button .ck{width:16px;color:var(--accent)}
.devmenu button.cur{font-weight:600}
.mhead .btns{margin-left:auto;flex-shrink:0;white-space:nowrap}
.mname{font-weight:600;font-size:15px;white-space:nowrap}
/* Narrow window: icon-only Pause all / Reset volumes, with the label still in the tooltip. */
@media (max-width:380px){ button.wide span{display:none} button.wide{padding:0 6px} }
.dev{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{margin:14px 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.row{padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.top{display:flex;align-items:center;gap:8px}
.info{flex:1;min-width:0}
/* App icon (or the tab's favicon); a letter tile when there's none. */
.appicon{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
         background:var(--chip);color:var(--muted);font-size:12px;font-weight:600;overflow:hidden}
.appicon.img{background:transparent}
.appicon img{width:100%;height:100%;object-fit:contain}
.row.child .appicon{width:18px;height:18px;border-radius:4px;font-size:10px}
.recent .appicon img{opacity:.75}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .name{font-weight:500;color:var(--muted)}
.btns{display:flex;gap:2px}
button{font:inherit;border:0;background:transparent;color:var(--fg);border-radius:6px;cursor:pointer;
       min-width:28px;height:28px;padding:0 6px}
button:hover{background:var(--chip)}
button[hidden]{display:none}
button svg{width:16px;height:16px;display:block;margin:auto}
button.wide{display:inline-flex;align-items:center;gap:6px;padding:0 8px;font-size:13px}
button.wide svg{margin:0}
button.wide[hidden]{display:none}
button.undo{background:var(--chip);color:var(--accent)}
.mname svg{width:16px;height:16px;vertical-align:-2px;color:var(--muted)}
.vol{display:flex;align-items:center;gap:8px;margin-top:4px}
.vol[hidden]{display:none}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.pct{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.mute.on{color:var(--danger)}
.meter{height:3px;border-radius:2px;background:var(--chip);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--meter);transition:width .15s linear}
.recent .meter{display:none}
.master{margin-bottom:2px}
.row.child{padding:6px 0 6px 10px;border-top:0}
.row.child .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.child .meter{display:none}
/* Per-row volume stays folded behind the speaker button; it shows the level only when it isn't 100%. */
.volbtn{display:inline-flex;align-items:center;gap:3px;color:var(--muted)}
.volbtn .lvl{font-size:11px;font-variant-numeric:tabular-nums}
.volbtn.on{color:var(--danger)}
.volbtn.open{background:var(--chip);color:var(--fg)}
/* A row's volume: one floating panel with a vertical slider, so it can't be
   mistaken for the progress bar under the title. */
.volpop{position:fixed;z-index:20;width:48px;padding:8px 0 6px;display:flex;flex-direction:column;
        align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;
        box-shadow:0 8px 24px rgba(0,0,0,.3)}
.volpop[hidden]{display:none}
.volpop .pct{width:auto;text-align:center;font-size:11px}
.volpop .vslider{writing-mode:vertical-lr;direction:rtl;width:24px;height:110px;margin:0;
                 accent-color:var(--accent);cursor:pointer}
.volpop .mute.on{color:var(--danger)}
/* Playback position: thin bar, thumb on hover, drag to seek. */
.prog{--bar:var(--accent);display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11px;
      color:var(--muted);font-variant-numeric:tabular-nums}
.prog[hidden]{display:none}
.prog .t{min-width:32px}
.prog .t1{text-align:right}
.seek{-webkit-appearance:none;appearance:none;height:14px;background:transparent;cursor:pointer;margin:0}
.seek::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(var(--bar),var(--bar)) 0/var(--p,0%) 100% no-repeat,var(--chip)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--bar);margin-top:-4px;opacity:0;transition:opacity .15s}
.prog:hover .seek::-webkit-slider-thumb,.seek:active::-webkit-slider-thumb{opacity:1}
.seek:disabled{cursor:default}
.recent .prog{--bar:var(--muted)}
.row.hasprog > .meter{display:none}
/* A browser and its tabs: one block, tabs indented under a rail. */
.group{margin:4px 0 0 6px;border-left:2px solid var(--line)}
.group[hidden], .kids:empty{display:none}
.ktoggle{height:22px;margin:4px 0 0 10px;padding:0 6px;font-size:11px;letter-spacing:.06em;
         text-transform:uppercase;color:var(--muted);font-weight:600}
.ktoggle .chev{display:inline-block;transition:transform .15s}
.krec.closed .chev{transform:rotate(-90deg)}
.krec.closed .kids{display:none}
.krec[hidden]{display:none}
/* Extension notes: install / turn on / update, one per browser that needs it. */
.notes:empty{display:none}
.note{position:relative;margin:10px 0 2px;padding:10px 34px 10px 12px;border:1px solid var(--line);
      border-radius:10px;background:var(--chip);font-size:12.5px}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note p{margin:0;color:var(--muted)}
.note .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note .acts button{height:26px;padding:0 10px;background:var(--card);border:1px solid var(--line);font-size:12px}
.note .acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note .dismiss{position:absolute;top:6px;right:6px;min-width:24px;height:24px;color:var(--muted)}
.note details{margin-top:8px;color:var(--muted)}
.note summary{cursor:pointer;color:var(--fg)}
.note ol{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}
.note code{display:block;margin:4px 0;padding:4px 6px;border-radius:6px;background:var(--card);
           font:11px/1.4 Consolas,monospace;color:var(--fg);word-break:break-all;user-select:all}
/* ✕ = close: shown on hover (and while asking "Close?"), never on browser group rows. */
.row > .top .x{visibility:hidden}
.row:hover > .top .x,.row > .top .x:focus-visible,.row > .top .x.arm{visibility:visible}
.x.arm{background:var(--danger);color:#fff;font-size:12px;padding:0 8px}
.x.arm:hover{background:var(--danger)}
/* Pinned: own section on top; the pin shows on hover, and always once pinned. */
h3[hidden]{display:none}
.row > .top .pin{visibility:hidden;color:var(--muted)}
.row:hover > .top .pin,.row > .top .pin:focus-visible,.row > .top .pin.on{visibility:visible}
.row > .top .pin.on{color:var(--accent)}
.row.idle > .meter{display:none}  /* the sound bar only while playing */
/* Click a name to bring its app or tab to the front. */
.info{cursor:pointer;border-radius:6px}
.info:hover .name{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="offline">Not connected to Faderly. Retrying…</div>
  <div id="machines"></div>
</main>
<script>
// One icon set drawn in currentColor, so every control looks the same on any font.
const I = (body, fill) => `<svg viewBox="0 0 16 16" aria-hidden="true" fill="${fill ? "currentColor" : "none"}"
  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICON = {
  play:  I(`<path d="M5 3.5v9l7-4.5z"/>`, true),
  pause: I(`<rect x="4" y="3.5" width="2.5" height="9" rx=".6"/><rect x="9.5" y="3.5" width="2.5" height="9" rx=".6"/>`, true),
  prev:  I(`<path d="M12 3.5v9L6 8z" fill="currentColor"/><path d="M4 3.5v9"/>`),
  next:  I(`<path d="M4 3.5v9L10 8z" fill="currentColor"/><path d="M12 3.5v9"/>`),
  x:     I(`<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>`),
  vol:   I(`<path d="M2.5 6h2.5l3.5-3v10L5 10H2.5z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/>`),
  muted: I(`<path d="M2.5 6h2.5l3.5-3v10L5 10H2.5z" fill="currentColor"/><path d="M11 6l3.5 4M14.5 6L11 10"/>`),
  reset: I(`<path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v3h3"/>`),
  expand: I(`<path d="M9.5 2.5h4v4M13.5 2.5L8.5 7.5M6.5 13.5h-4v-4M2.5 13.5l5-5"/>`),
  check: I(`<path d="M3.5 8.5l3 3 6-7"/>`),
  pin:   I(`<path d="M9.8 2.2l4 4-1.6.4-2.6 2.6.4 3.1-1 1-2.6-2.6-3.9 3.9-.6-.6 3.9-3.9L3.2 7.5l1-1 3.1.4 2.6-2.6z"/>`),
  pinOn: I(`<path d="M9.8 2.2l4 4-1.6.4-2.6 2.6.4 3.1-1 1-2.6-2.6-3.9 3.9-.6-.6 3.9-3.9L3.2 7.5l1-1 3.1.4 2.6-2.6z"/>`, true),
  screen: I(`<rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/>`),
};
let ws, dragging = null;

function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => document.body.classList.remove("down");
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { document.body.classList.add("down"); setTimeout(connect, 1000); };
}

function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }

function ago(s){
  if (s == null) return "";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

// A volume slider + mute button + percentage, reused for master and app rows.
function volumeControls(node, onVolume, onMute){
  const range = node.querySelector("input"), mute = node.querySelector(".mute");
  range.addEventListener("pointerdown", () => dragging = range);
  range.addEventListener("change", () => { if (dragging === range) dragging = null; });
  range.addEventListener("input", () => { node.querySelector(".pct").textContent = range.value + "%"; onVolume(range.value / 100); });
  mute.addEventListener("click", () => onMute(!mute.classList.contains("on")));
}
function setVolume(node, volume, muted){
  const range = node.querySelector("input");
  if (dragging !== range) {
    range.value = Math.round(volume * 100);
    node.querySelector(".pct").textContent = range.value + "%";
  }
  const mute = node.querySelector(".mute");
  mute.classList.toggle("on", !!muted);
  if (mute.dataset.icon !== String(!!muted)) {
    mute.dataset.icon = String(!!muted);
    mute.innerHTML = muted ? ICON.muted : ICON.vol;
  }
  mute.title = muted ? "Unmute" : "Mute";
}
const VOL_HTML = `<div class="vol"><button class="mute"></button><input type="range" min="0" max="100"><span class="pct"></span></div>`;

// ---- a row's volume: one floating panel, opened from that row's speaker button
const volPop = el(`<div class="volpop" hidden role="dialog" aria-label="Volume">
  <span class="pct"></span>
  <input class="vslider" type="range" min="0" max="100" aria-label="Volume">
  <button class="mute"></button>
</div>`);
let volFor = null; // {n, machine, key, btn} while the panel is open
document.body.appendChild(volPop);
volumeControls(volPop,
  v => volFor && send({machine: volFor.machine, key: volFor.key, cmd: "volume", value: v}),
  m => volFor && send({machine: volFor.machine, key: volFor.key, cmd: "mute", value: m}));
volPop.addEventListener("click", e => e.stopPropagation());
volPop.addEventListener("wheel", e => {  // wheel over the panel: 5% steps
  e.preventDefault();
  const range = volPop.querySelector(".vslider");
  range.value = Math.max(0, Math.min(100, Number(range.value) + (e.deltaY < 0 ? 5 : -5)));
  range.dispatchEvent(new Event("input"));
}, {passive: false});
document.addEventListener("click", () => closeVolPop());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeVolPop(); });
window.addEventListener("resize", () => closeVolPop());
document.addEventListener("scroll", e => { if (!volPop.contains(e.target)) closeVolPop(); }, true);

function toggleVolPop(n, machine, key, btn){
  if (volFor && volFor.n === n) return closeVolPop();
  closeVolPop();
  if (!n._vol) return;
  volFor = {n, machine, key, btn};
  setVolume(volPop, n._vol.volume, n._vol.muted);
  btn.classList.add("open");
  volPop.hidden = false;
  placeVolPop(btn);
}
function closeVolPop(){
  if (!volFor) return;
  volFor.btn.classList.remove("open");
  volFor = null;
  volPop.hidden = true;
  if (dragging === volPop.querySelector(".vslider")) dragging = null;
}
// Below the button; above it if there's no room; beside it in a short window (the tray flyout).
function placeVolPop(btn){
  const r = btn.getBoundingClientRect(), w = volPop.offsetWidth, h = volPop.offsetHeight, gap = 6, pad = 4;
  const clampX = x => Math.max(pad, Math.min(innerWidth - w - pad, x));
  const clampY = y => Math.max(pad, Math.min(innerHeight - h - pad, y));
  let x = clampX(r.left + r.width / 2 - w / 2), y;
  if (r.bottom + gap + h <= innerHeight - pad) y = r.bottom + gap;
  else if (r.top - gap - h >= pad) y = r.top - gap - h;
  else { x = clampX(r.left - gap - w); y = clampY(r.top + r.height / 2 - h / 2); }
  volPop.style.left = x + "px";
  volPop.style.top = y + "px";
}

// Which nested Recent lists are folded, per browser; a per-viewer convenience.
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem("foldedRecent") || "[]")); } catch {}
function saveFolded(){ try { localStorage.setItem("foldedRecent", JSON.stringify([...folded])); } catch {} }

function makeRow(machine, key){
  const n = el(`<div class="row">
    <div class="top">
      <span class="appicon"></span>
      <div class="info"><div class="name"></div><div class="sub"></div></div>
      <div class="btns">
        <button class="prev" title="Previous">${ICON.prev}</button>
        <button class="pp"></button>
        <button class="next" title="Next">${ICON.next}</button>
        <button class="volbtn" title="Volume"></button>
        <button class="pin"></button>
        <button class="x">${ICON.x}</button>
      </div>
    </div>
    <div class="prog" hidden><span class="t t0"></span><input class="seek" type="range" min="0" step="1"><span class="t t1"></span></div>
    <div class="meter"><i></i></div>
    <div class="group" hidden>
      <div class="kids"></div>
      <div class="krec" hidden>
        <button class="ktoggle"><span class="chev">▾</span> Recent <span class="kcount"></span></button>
        <div class="kids recent"></div>
      </div>
    </div>
  </div>`);
  const c = cmd => () => send({machine, key, cmd});
  const info = n.querySelector(".info");
  info.title = "Show";
  info.onclick = c("focus");
  n.querySelector(".pin").onclick = e => {
    e.stopPropagation();
    send({machine, key, cmd: n._pinned ? "unpin" : "pin", value: n._name});
  };
  const krec = n.querySelector(".krec");
  krec.classList.toggle("closed", folded.has(key));
  n.querySelector(".ktoggle").onclick = () => {
    krec.classList.toggle("closed");
    krec.classList.contains("closed") ? folded.add(key) : folded.delete(key);
    saveFolded();
  };
  n.querySelector(".prev").onclick = c("prev");
  n.querySelector(".pp").onclick = c("playpause");
  n.querySelector(".next").onclick = c("next");
  n.querySelector(".x").onclick = e => {
    e.stopPropagation();
    armClose(e.currentTarget, !key.includes("#"), () => send({machine, key, cmd: "close"}));
  };
  n.querySelector(".volbtn").onclick = e => { e.stopPropagation(); toggleVolPop(n, machine, key, e.currentTarget); };
  const seek = n.querySelector(".seek");
  seek.addEventListener("pointerdown", () => dragging = seek);
  seek.addEventListener("input", () => paintProgress(n, Number(seek.value)));
  seek.addEventListener("change", () => {
    if (dragging === seek) dragging = null;
    const v = Number(seek.value);
    send({machine, key, cmd: "seek", value: v});
    if (n._p) Object.assign(n._p, {pos: v, at: performance.now()}); // don't jump back until the next report
  });
  return n;
}

// ✕ closes. A tab closes at once (Ctrl+Shift+T brings it back); an app is asked to
// close, as its own ✕ would, only after a second click on "Close?" within 3 s.
function armClose(btn, needsConfirm, doClose){
  if (!needsConfirm || btn.classList.contains("arm")) {
    clearTimeout(btn._disarm);
    btn.classList.remove("arm");
    btn.innerHTML = ICON.x;
    doClose();
    return;
  }
  btn.classList.add("arm");
  btn.textContent = "Close?";
  btn._disarm = setTimeout(() => { btn.classList.remove("arm"); btn.innerHTML = ICON.x; }, 3000);
}

function setIcon(n, r){
  const box = n.querySelector(".appicon");
  const want = r.icon && !(box._failed || new Set()).has(r.icon) ? r.icon : "";
  const letter = (r.name || "?").trim().charAt(0).toUpperCase();
  if (box.dataset.src === want && (want || box.textContent === letter)) return;
  box.dataset.src = want;
  box.classList.toggle("img", !!want);
  if (!want) { box.textContent = letter; return; }
  const img = new Image();
  img.alt = "";
  img.onerror = () => {  // dead favicon: letter tile, and don't retry it
    (box._failed ||= new Set()).add(want);
    box.dataset.src = ""; box.classList.remove("img"); box.textContent = letter;
  };
  img.src = want;
  box.replaceChildren(img);
}

function updateRow(n, r, section, machine){
  if (section === "pinned") section = r.live || "recent";  // a pinned row plays or doesn't
  n.classList.toggle("child", !!r.parent);
  n.classList.toggle("idle", section !== "playing");
  n._pinned = !!r.pinned; n._name = r.name;
  setIcon(n, r);
  n.querySelector(".name").textContent = r.name;
  n.querySelector(".info").title = `Show ${r.name}`;
  const pin = n.querySelector(".pin");
  pin.hidden = !!r.parent;  // tabs come and go: not pinnable
  pin.classList.toggle("on", !!r.pinned);
  if (pin.dataset.icon !== String(!!r.pinned)) {
    pin.dataset.icon = String(!!r.pinned);
    pin.innerHTML = r.pinned ? ICON.pinOn : ICON.pin;
  }
  pin.title = r.pinned ? "Unpin" : "Pin to the top";
  const track = [r.title, r.artist].filter(Boolean).join(r.title ? " – " : " · ");
  let sub;
  if (r.group && section === "playing" && !track) {
    const k = r.tabs.length;
    sub = k ? `${k} tab${k > 1 ? "s" : ""} playing` : "Playing";
  } else if (r.group && section !== "playing" && !track) {
    const k = r.tabs.length;
    sub = [`${k} tab${k > 1 ? "s" : ""}`, ago(r.ago)].filter(Boolean).join(" · ");
  } else if (section === "playing") sub = track || "Playing";
  else if (r.status === "running") sub = "No sound";
  else sub = [track, r.status, ago(r.ago)].filter(Boolean).join(" · ");
  n.querySelector(".sub").textContent = sub;
  n.querySelector(".sub").title = sub;

  const playing = section === "playing";
  // Previous/next wherever the player supports them, paused or playing.
  n.querySelector(".prev").hidden = !(r.media && r.canPrev);
  n.querySelector(".next").hidden = !(r.media && r.canNext);
  const pp = n.querySelector(".pp");
  pp.hidden = !r.media;
  if (pp.dataset.icon !== String(playing)) {
    pp.dataset.icon = String(playing);
    pp.innerHTML = playing ? ICON.pause : ICON.play;
  }
  pp.title = playing ? "Pause" : "Resume";
  const x = n.querySelector(".x");
  x.hidden = !!r.group || !r.canClose;
  x.title = r.parent ? "Close tab" : `Close ${r.name}`;

  const vb = n.querySelector(".volbtn");
  vb.hidden = r.volume == null;
  n._vol = r.volume == null ? null : {volume: r.volume, muted: !!r.muted};
  if (volFor && volFor.n === n) {
    if (r.volume == null) closeVolPop(); else setVolume(volPop, r.volume, r.muted);
  }
  if (r.volume != null) {
    const pct = Math.round(r.volume * 100);
    const state = `${!!r.muted}|${pct}`;
    if (vb.dataset.state !== state) {
      vb.dataset.state = state;
      vb.innerHTML = (r.muted ? ICON.muted : ICON.vol) + (!r.muted && pct < 100 ? `<span class="lvl">${pct}%</span>` : "");
      vb.classList.toggle("on", !!r.muted);
      vb.title = r.muted ? "Muted · click for volume" : `Volume ${pct}%`;
    }
  }
  updateProgress(n, r, playing);
  const level = r.muted ? 0 : Math.min(1, Math.sqrt(r.peak));
  n.querySelector(".meter i").style.width = (level * 100).toFixed(1) + "%";

  const group = n.querySelector(".group");
  group.hidden = !r.group;
  if (r.group) {
    syncList(group.querySelector(":scope > .kids"), r.tabs, machine, section);
    const rec = r.recentTabs || [];
    const krec = group.querySelector(":scope > .krec");
    krec.hidden = rec.length === 0;
    krec.querySelector(".kcount").textContent = rec.length ? `(${rec.length})` : "";
    syncList(krec.querySelector(".kids"), rec, machine, "recent");
  }
}

// Keyed list update: keep DOM nodes so clicks and drags aren't interrupted by refreshes.
function fmt(t){
  t = Math.max(0, Math.floor(t));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = String(t % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
}
// The hub reports a position every poll; between reports the bar runs on by itself.
function updateProgress(n, r, playing){
  const prog = n.querySelector(".prog");
  const has = r.position != null && r.duration > 0;
  prog.hidden = !has;
  n.classList.toggle("hasprog", has);
  if (!has) { n._p = null; return; }
  const seek = prog.querySelector(".seek");
  seek.max = Math.floor(r.duration);
  seek.disabled = !r.seekable;
  prog.title = r.seekable ? "Drag to seek" : "";
  const now = performance.now(), p = n._p;
  const guess = p ? p.pos + (p.playing ? (now - p.at) / 1000 : 0) : null;
  // Small drift: keep the smooth local clock. A real jump (seek, next track): take the report.
  if (!p || !playing || !p.playing || Math.abs(guess - r.position) > 1.5 || p.dur !== r.duration)
    n._p = {pos: r.position, at: now, dur: r.duration, playing};
  if (dragging !== seek) paintProgress(n);
}
function paintProgress(n, at){
  const p = n._p; if (!p) return;
  const pos = at ?? Math.min(p.dur, p.pos + (p.playing ? (performance.now() - p.at) / 1000 : 0));
  const seek = n.querySelector(".seek");
  if (at == null) seek.value = Math.floor(pos);
  seek.style.setProperty("--p", (pos / p.dur * 100).toFixed(2) + "%");
  n.querySelector(".t0").textContent = fmt(pos);
  n.querySelector(".t1").textContent = fmt(p.dur);
}
setInterval(() => {
  for (const n of document.querySelectorAll(".row.hasprog"))
    if (n._p && n._p.playing && dragging !== n.querySelector(".seek")) paintProgress(n);
}, 250);

function syncList(container, rows, machine, section, empty){
  const cache = container._nodes || (container._nodes = new Map());
  const seen = new Set();
  rows.forEach((r, i) => {
    let n = cache.get(r.key);
    if (!n) { n = makeRow(machine, r.key); cache.set(r.key, n); }
    updateRow(n, r, section, machine);
    if (container.children[i] !== n) container.insertBefore(n, container.children[i] || null);
    seen.add(r.key);
  });
  for (const [k, n] of cache) if (!seen.has(k)) { n.remove(); cache.delete(k); }
  if (empty) empty.hidden = rows.length > 0;
}

function allButton(b, undo, [ui, ut, utip], [di, dt, dtip]){
  const state = undo ? "undo" : "do";
  if (b.dataset.state === state) return;
  b.dataset.state = state;
  if (undo) b.dataset.undo = "1"; else delete b.dataset.undo;
  b.innerHTML = (undo ? ui : di) + `<span>${undo ? ut : dt}</span>`;
  b.title = undo ? utip : dtip;
  b.classList.toggle("undo", undo);
}

// Output picker: rebuilt only when the device list or the current device changes.
function renderDevices(n, m){
  const dev = n.querySelector(".dev"), menu = n.querySelector(".devmenu");
  const outs = m.master.outputs || [];
  dev.querySelector(".devname").textContent = m.master.device;
  dev.disabled = outs.length < 2;
  dev.title = dev.disabled ? m.master.device : "Change output device";
  const sig = JSON.stringify([m.master.deviceId, outs]);
  if (menu.dataset.sig === sig) return;
  menu.dataset.sig = sig;
  menu.innerHTML = "<h4>Output</h4>";
  for (const o of outs) {
    const cur = o.id === m.master.deviceId;
    const b = el(`<button><span class="ck">${cur ? ICON.check : ""}</span><span></span></button>`);
    b.lastChild.textContent = o.name;
    b.classList.toggle("cur", cur);
    b.onclick = () => {
      menu.hidden = true;
      if (!cur) send({machine: m.id, cmd: "set_output", value: o.id});
    };
    menu.appendChild(b);
  }
}

// ---- extension notes ---------------------------------------------------------------
// The hub says, per open browser: ok / missing / outdated. A note's ✕ hides that
// note (that browser, that problem, that version) for this viewer.
let hiddenNotes = new Set();
try { hiddenNotes = new Set(JSON.parse(localStorage.getItem("hiddenNotes") || "[]")); } catch {}
const noteId = b => `${b.key}:${b.state}:${b.state === "outdated" ? b.latest : ""}`;

function noteHtml(b, dir){
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const name = esc(b.name);
  if (b.state === "missing") return `
    <b>Control ${name} tabs here</b>
    <p>Add the Faderly extension to ${name}. Already added? Make sure it's switched on in ${name}'s extensions page.</p>
    <div class="acts"><button class="primary" data-cmd="ext_open_page">Open ${name} extensions</button></div>
    <details><summary>How to add it</summary><ol>
      <li>Open ${name}'s extensions page (button above).</li>
      <li>Turn on <b style="display:inline">Developer mode</b> (top right).</li>
      <li>Click <b style="display:inline">Load unpacked</b> and choose this folder:
        <code>${esc(dir)}</code>
        <span class="acts"><button data-copy>Copy folder path</button><button data-cmd="ext_open_folder">Show folder</button></span></li>
    </ol></details>`;
  if (b.state === "outdated") return `
    <b>Extension update for ${name}</b>
    <p>Version ${esc(b.latest)} is ready${b.version && b.version !== "0" ? ` (${name} has ${esc(b.version)})` : ""}.</p>
    <div class="acts">${b.accepts.includes("reload")
      ? `<button class="primary" data-cmd="ext_update">Update now</button>`
      : `<button class="primary" data-cmd="ext_update">Open ${name} extensions</button>
         <span>then click ↻ on Faderly.</span>`}</div>`;
  return "";
}

function renderNotes(n, m){
  const box = n.querySelector(".notes");
  const want = (m.browsers || []).filter(b => b.state !== "ok" && !hiddenNotes.has(noteId(b)));
  const sig = JSON.stringify([want, m.extensionDir]);
  if (box.dataset.sig === sig) return;  // keep open <details> and focus across refreshes
  box.dataset.sig = sig;
  box.replaceChildren(...want.map(b => {
    const card = el(`<div class="note" role="status">${noteHtml(b, m.extensionDir)}
      <button class="dismiss" title="Hide this note">${ICON.x}</button></div>`);
    card.querySelectorAll("[data-cmd]").forEach(btn =>
      btn.onclick = () => send({machine: m.id, cmd: btn.dataset.cmd, value: b.key}));
    const copy = card.querySelector("[data-copy]");
    if (copy) copy.onclick = async () => {
      try { await navigator.clipboard.writeText(m.extensionDir); copy.textContent = "Copied"; }
      catch { copy.textContent = "Select the path above to copy it"; }
    };
    card.querySelector(".dismiss").onclick = () => {
      hiddenNotes.add(noteId(b));
      try { localStorage.setItem("hiddenNotes", JSON.stringify([...hiddenNotes])); } catch {}
      box.dataset.sig = ""; renderNotes(n, m);
    };
    return card;
  }));
}

const machineNodes = new Map();
function render(state){
  const root = document.getElementById("machines");
  for (const m of state.machines) {
    let n = machineNodes.get(m.id);
    if (!n) {
      n = el(`<section class="machine">
        <div class="mhead"><span class="mname"></span>
          <button class="dev" title="Change output device"><span class="devname"></span><span class="chev">▾</span></button>
          <div class="btns">
            <button class="pauseall wide"></button>
            <button class="resetall wide" title="Set every app and tab to 100% and unmute them. The main volume stays as it is.">${ICON.reset}<span>Reset volumes</span></button>
            <button class="openfull" title="Open Faderly">${ICON.expand}</button>
          </div>
        </div>
        <div class="devmenu" hidden></div>
        <div class="master">${VOL_HTML}</div>
        <div class="notes"></div>
        <h3 class="pinned-head">Pinned</h3>
        <div class="list pinned"></div>
        <h3>Now playing</h3>
        <div class="empty playing-empty">Nothing playing</div>
        <div class="list playing"></div>
        <h3>Recent</h3>
        <div class="empty recent-empty">Nothing recent</div>
        <div class="list recent"></div>
      </section>`);
      volumeControls(n.querySelector(".master .vol"),
        v => send({machine: m.id, cmd: "master_volume", value: v}),
        x => send({machine: m.id, cmd: "master_mute", value: x}));
      // Each button undoes its own last press while nothing new is playing.
      n.querySelector(".pauseall").onclick = e =>
        send({machine: m.id, cmd: e.currentTarget.dataset.undo ? "resume_all" : "pause_all"});
      n.querySelector(".openfull").onclick = () => window.pywebview?.api?.open_full();
      const menu = n.querySelector(".devmenu");
      n.querySelector(".dev").onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
      menu.onclick = e => e.stopPropagation();
      document.addEventListener("click", () => { menu.hidden = true; });
      document.addEventListener("keydown", e => { if (e.key === "Escape") menu.hidden = true; });
      n.querySelector(".resetall").onclick = () => send({machine: m.id, cmd: "reset_volumes"});
      machineNodes.set(m.id, n);
      root.appendChild(n);
    }
    n.querySelector(".mname").innerHTML = ICON.screen;
    n.querySelector(".mname").append(" " + m.name);
    allButton(n.querySelector(".pauseall"), m.canResume,
      [ICON.play, "Resume all", "Resume what Pause all paused"],
      [ICON.pause, "Pause all", "Pause everything playing (tabs that can't be paused are muted)"]);
    n.querySelector(".resetall").hidden = !m.canReset; // everything at 100%: nothing to reset
    renderDevices(n, m);
    renderNotes(n, m);
    setVolume(n.querySelector(".master .vol"), m.master.volume, m.master.muted);
    syncList(n.querySelector(":scope > .list.pinned"), m.pinned || [], m.id, "pinned");
    n.querySelector(".pinned-head").hidden = !(m.pinned || []).length;
    syncList(n.querySelector(":scope > .list.playing"), m.playing, m.id, "playing", n.querySelector(".playing-empty"));
    syncList(n.querySelector(":scope > .list.recent"), m.recent, m.id, "recent", n.querySelector(".recent-empty"));
  }
}

// ---- tray flyout (?flyout=1): sized to its content; Esc hides it. (Hiding when
// focus moves elsewhere is done by the app: the page's blur also fires on show.)
if (new URLSearchParams(location.search).has("flyout")) {
  document.body.classList.add("flyout");
  const api = () => window.pywebview?.api;
  document.addEventListener("keydown", e => { if (e.key === "Escape") api()?.blur(); });
  let asked = 0;
  const fit = () => {
    const h = Math.ceil(document.querySelector("main").getBoundingClientRect().height);
    if (Math.abs(h - asked) > 1) { asked = h; api()?.fit(h); }
  };
  new ResizeObserver(fit).observe(document.querySelector("main"));
  window.addEventListener("pywebviewready", fit);
  window.flyoutShown = () => { asked = 0; fit(); window.focus(); };
}

connect();
</script>
