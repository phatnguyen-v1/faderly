<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Hub</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="title">Audio Hub</span>
    <span class="hub" id="hub"></span>
    <div class="btns">
      <button id="pauseAll" class="wide" title="Pause every tab"></button>
      <button id="resetAll" class="wide" title="Set every tab to 100% and unmute it"></button>
    </div>
  </header>

  <h3>Now playing</h3>
  <div class="empty" id="playingEmpty">No tab is playing</div>
  <div class="list" id="playing"></div>

  <h3>Recent</h3>
  <div class="empty" id="recentEmpty">Nothing recent</div>
  <div class="list recent" id="recent"></div>

  <footer>
    <label><input type="checkbox" id="onePlayer"> Only one tab plays at a time</label>
    <a href="#" id="shortcuts">Keyboard shortcuts…</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
